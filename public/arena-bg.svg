<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Night Studio Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0a1122" />
      <stop offset="78%" stop-color="#0f1b33" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Left Emerald Stage Spotlight -->
    <radialGradient id="spotEmerald" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Right Cyan Stage Spotlight -->
    <radialGradient id="spotCyan" cx="82%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Center Warm Amber Stage Glow -->
    <radialGradient id="spotAmber" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Horizon Stage Glow -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <!-- Spotlight Cone Gradients -->
    <linearGradient id="beamLeft" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamRight" x1="100%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Stage Floor Grid Gradient -->
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Base Sky / Studio Backdrop -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Ambient Spotlights -->
  <rect width="1920" height="1080" fill="url(#spotEmerald)" />
  <rect width="1920" height="1080" fill="url(#spotCyan)" />
  <rect width="1920" height="1080" fill="url(#spotAmber)" />

  <!-- Studio Light Beams from Top Truss -->
  <polygon points="180,0 50,1080 780,1080 340,0" fill="url(#beamLeft)" />
  <polygon points="1740,0 1140,1080 1870,1080 1580,0" fill="url(#beamRight)" />
  <polygon points="880,0 560,1080 1360,1080 1040,0" fill="url(#beamCenter)" />

  <!-- Subtle Starfield / Studio Sparkles -->
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="140" cy="110" r="1.5" />
    <circle cx="290" cy="210" r="2" fill="#34d399" />
    <circle cx="480" cy="95" r="1.2" />
    <circle cx="670" cy="160" r="1.8" fill="#22d3ee" />
    <circle cx="890" cy="80" r="1.4" />
    <circle cx="1080" cy="140" r="2" fill="#fbbf24" />
    <circle cx="1290" cy="95" r="1.5" />
    <circle cx="1490" cy="180" r="2.2" fill="#22d3ee" />
    <circle cx="1680" cy="120" r="1.5" />
    <circle cx="1810" cy="240" r="1.8" fill="#34d399" />
    <circle cx="210" cy="390" r="1.4" />
    <circle cx="1720" cy="410" r="1.6" />
    <circle cx="410" cy="310" r="1.3" />
    <circle cx="1540" cy="300" r="1.3" />
  </g>

  <!-- Distant Arena Amphitheater Arches / Sound Waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M -120 760 Q 960 320 2040 760" stroke="#1e293b" stroke-width="2" opacity="0.55" />
    <path d="M -80 800 Q 960 400 2000 800" stroke="#0f172a" stroke-width="3" opacity="0.7" />
    <path d="M 100 740 Q 960 440 1820 740" stroke="url(#horizonGlow)" stroke-width="2.5" opacity="0.75" />
  </g>

  <!-- Subtle Floating Kahoot / Quiz Geometric Emblems in Background -->
  <!-- Triangle (Top Left) -->
  <g transform="translate(115, 280) rotate(-14)" opacity="0.12">
    <polygon points="0,-38 34,24 -34,24" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" />
  </g>
  <!-- Diamond (Top Right) -->
  <g transform="translate(1790, 270) rotate(18)" opacity="0.12">
    <rect x="-26" y="-26" width="52" height="52" rx="8" fill="none" stroke="#0ea5e9" stroke-width="5" />
  </g>
  <!-- Circle (Mid Left) -->
  <g transform="translate(165, 580)" opacity="0.10">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f59e0b" stroke-width="5" />
  </g>
  <!-- Square (Mid Right) -->
  <g transform="translate(1755, 575) rotate(-10)" opacity="0.10">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="none" stroke="#10b981" stroke-width="5" />
  </g>

  <!-- Distant Stage Silhouette Hills / Crowd Stands -->
  <path d="M 0 740 C 320 675, 590 725, 960 705 C 1330 685, 1600 660, 1920 735 L 1920 1080 L 0 1080 Z" fill="#060a14" opacity="0.92" />

  <!-- Glowing Stage Horizon Divider -->
  <path d="M 0 740 C 320 675, 590 725, 960 705 C 1330 685, 1600 660, 1920 735" fill="none" stroke="url(#horizonGlow)" stroke-width="3" />

  <!-- Perspective Stage Floor Grid -->
  <g stroke="url(#gridLine)" stroke-width="1.2" opacity="0.65">
    <!-- Perspective radiating lines from stage center -->
    <line x1="960" y1="705" x2="-300" y2="1080" />
    <line x1="960" y1="705" x2="20" y2="1080" />
    <line x1="960" y1="705" x2="340" y2="1080" />
    <line x1="960" y1="705" x2="650" y2="1080" />
    <line x1="960" y1="705" x2="960" y2="1080" />
    <line x1="960" y1="705" x2="1270" y2="1080" />
    <line x1="960" y1="705" x2="1580" y2="1080" />
    <line x1="960" y1="705" x2="1900" y2="1080" />
    <line x1="960" y1="705" x2="2220" y2="1080" />

    <!-- Horizontal stage floor rings -->
    <line x1="0" y1="765" x2="1920" y2="765" stroke="#1e293b" stroke-opacity="0.5" />
    <line x1="0" y1="815" x2="1920" y2="815" stroke="#1e293b" stroke-opacity="0.55" />
    <line x1="0" y1="875" x2="1920" y2="875" stroke="#1e293b" stroke-opacity="0.6" />
    <line x1="0" y1="950" x2="1920" y2="950" stroke="#1e293b" stroke-opacity="0.65" />
    <line x1="0" y1="1035" x2="1920" y2="1035" stroke="#1e293b" stroke-opacity="0.7" />
  </g>
</svg>
